[project]
name = "ivdb"
version = "0.2.0"
description = "Daily implied-volatility collector (CBOE delayed quotes) that builds an owned IV history for computing IV Rank."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
ivdb = "ivdb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
